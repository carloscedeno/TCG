name: SortSwift Inventory Sync

on:
  schedule:
    # Run twice daily: 04:30 UTC (nightly) and 16:30 UTC (mid-day store sync)
    - cron: '30 4,16 * * *'
  workflow_dispatch:
    inputs:
      green_only:
        description: 'Sync only green bins (verified Status OK lots)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry-run simulation (no database writes)'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [sortswift_sync_trigger]

jobs:
  sync-sortswift:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Invoke Authoritative SortSwift Sync Edge Function (v4.0)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - << 'EOF'
          import os, json, sys, urllib.request

          base_url = (os.environ.get("SUPABASE_URL") or "https://sxuotvogwvmxuvwbsscv.supabase.co").rstrip("/")
          url = f"{base_url}/functions/v1/sortswift-sync"
          token = os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or os.environ.get("SUPABASE_ANON_KEY") or ""

          headers = {"Content-Type": "application/json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(
              url,
              data=json.dumps({"target_env": "prod"}).encode("utf-8"),
              headers=headers,
              method="POST"
          )

          print(f"Invoking {url} ...")
          with urllib.request.urlopen(req, timeout=150) as r:
              res = json.loads(r.read().decode("utf-8"))

          print("Response:", json.dumps({
              k: res.get(k) for k in (
                  "success", "status", "duration_ms", "total_raw_cards",
                  "total_units", "total_unique_nodes", "added_count",
                  "updated_count", "unchanged_count", "zeroed_count",
                  "odoo_synced", "message"
              )
          }, indent=2))

          if not res.get("success"):
              sys.exit(1)
          EOF
